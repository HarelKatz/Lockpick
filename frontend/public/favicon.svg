<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#161b22"/>
  <!-- Lock body -->
  <rect x="5" y="17" width="17" height="12" rx="3" fill="#58a6ff"/>
  <!-- Shackle (open — right side lifted) -->
  <path d="M8 17V11C8 7.686 10.686 5 13.5 5S19 7.686 19 11v2" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="13.5" cy="22" r="1.8" fill="#161b22"/>
  <rect x="12.6" y="22" width="1.8" height="3" rx="0.9" fill="#161b22"/>
  <!-- Lockpick tool -->
  <path d="M21 10 L27 6" stroke="#a5d6ff" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="27" cy="6" r="1.2" fill="#a5d6ff"/>
</svg>
