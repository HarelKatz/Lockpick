network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      addresses:
        - 192.168.1.10/24
        - 10.0.0.5/24
      gateway4: 192.168.1.1
      routes:
        - to: default
          via: 192.168.1.1
    eth1:
      dhcp4: true
  vlans:
    vlan10:
      id: 10
      link: eth0
      addresses: [10.10.10.5/24]
