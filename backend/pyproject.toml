[project]
name = "lockpick"
version = "0.1.0"
description = "Lockpick — Red Team Operation Manager"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "paramiko>=4.0.0",
    "python-multipart>=0.0.22",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
    "anyio>=4.0.0",
    "pytest-xdist>=3.0.0",
    "hypothesis>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
# NOTE: markers (slow / property) are registered in tests/conftest.py via
# pytest_configure, NOT here. The Makefile runs `cd backend && pytest ../tests/`,
# whose rootdir resolves to the repo root — so this backend/pyproject ini block is
# not loaded for that invocation. conftest is always loaded, so it is the one place
# that registers markers for every flow.

[tool.uv]
package = false
